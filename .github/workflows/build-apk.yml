name: Build Play Store Ready Java & XML App

on:
  repository_dispatch:
    types: [trigger-compiler]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 1. Dashboard se bheje gaye Java aur XML codes ko sahi paths par save karna
    # Yeh commands folder banayengi aur user ka code safely inject karengi (without syntax errors)
    - name: Inject Java and XML Layout Code
      run: |
        mkdir -p app/src/main/java/com/ani/vaibhaw/app
        mkdir -p app/src/main/res/layout
        
        cat << 'EOF' > app/src/main/java/com/ani/vaibhaw/app/MainActivity.java
        ${{ github.event.client_payload.java_code }}
        EOF
        
        cat << 'EOF' > app/src/main/res/layout/activity_main.xml
        ${{ github.event.client_payload.xml_code }}
        EOF

    # 2. Java environment configuration (Gradle build ke liye zaroori hai)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    # 3. Real Android SDK automatically download aur configure karna
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    # 4. GitHub Secrets se secure Keystore file (.jks) generate karna signature ke liye
    - name: Decode Keystore File
      run: |
        echo "${{ secrets.SIGNING_STORE_FILE_BASE64 }}" | base64 --decode > app/my-release-key.jks

    # 5. Play Store ready Signed Android App Bundle (AAB) compile karna
    - name: Build Signed Release AAB
      run: |
        chmod +x gradlew
        ./gradlew bundleRelease \
          -Pandroid.injected.signing.store.file=my-release-key.jks \
          -Pandroid.injected.signing.store.password=${{ secrets.SIGNING_STORE_PASSWORD }} \
          -Pandroid.injected.signing.key.alias=${{ secrets.SIGNING_KEY_ALIAS }} \
          -Pandroid.injected.signing.key.password=${{ secrets.SIGNING_KEY_PASSWORD }}

    # 6. Final Signed .aab bundle file ko upload karna taaki link active ho jaye
    - name: Upload Production AAB Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PlayStore-Ready-AAB
        path: app/build/outputs/bundle/release/app-release.aab
