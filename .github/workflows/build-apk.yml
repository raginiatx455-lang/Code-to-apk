name: Build Universal App

on:
  repository_dispatch:
    types: [trigger-compiler]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    # 1. Base Android Skeleton Setup
    - name: Auto-Generate Android Skeleton
      run: |
        gradle wrapper --gradle-version 8.1.0
        
        echo "include ':app'" > settings.gradle
        
        cat << 'EOF' > build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath "com.android.tools.build:gradle:8.1.0"
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        EOF

        # Directory structure for code and assets
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/java/com/ani/vaibhaw/app
        mkdir -p app/src/main/assets
        
        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
        }
        android {
            namespace 'com.ani.vaibhaw.app'
            compileSdk 34
            defaultConfig {
                applicationId "com.ani.vaibhaw.app"
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }
            buildTypes {
                release {
                    minifyEnabled false
                    proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                }
            }
        }
        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
        }
        EOF

    # 2. Injecting Java, XML, and Manifest directly into Android System
    - name: Inject Core Android Codes
      run: |
        cat << 'EOF' > app/src/main/java/com/ani/vaibhaw/app/MainActivity.java
        ${{ github.event.client_payload.java_code }}
        EOF
        
        cat << 'EOF' > app/src/main/res/layout/activity_main.xml
        ${{ github.event.client_payload.xml_code }}
        EOF
        
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        ${{ github.event.client_payload.manifest_code }}
        EOF

    # 3. Injecting Multi-Languages into Assets Folder
    - name: Inject Multi-Language Assets
      run: |
        cat << 'EOF' > app/src/main/assets/main.py
        ${{ github.event.client_payload.python_code }}
        EOF

        cat << 'EOF' > app/src/main/assets/main.cpp
        ${{ github.event.client_payload.cpp_code }}
        EOF

        cat << 'EOF' > app/src/main/assets/main.c
        ${{ github.event.client_payload.c_code }}
        EOF

        cat << 'EOF' > app/src/main/assets/main.cs
        ${{ github.event.client_payload.csharp_code }}
        EOF

        cat << 'EOF' > app/src/main/assets/index.html
        ${{ github.event.client_payload.html5_code }}
        EOF

        cat << 'EOF' > app/src/main/assets/style.css
        ${{ github.event.client_payload.css_code }}
        EOF

        cat << 'EOF' > app/src/main/assets/script.js
        ${{ github.event.client_payload.js_code }}
        EOF

        cat << 'EOF' > app/src/main/assets/main.php
        ${{ github.event.client_payload.php_code }}
        EOF

    # 4. Smart Keystore Detector 
    - name: Decode Keystore File
      env:
        KEYSTORE_BASE64: ${{ secrets.SIGNING_STORE_FILE_BASE64 }}
      run: |
        if [ ! -z "$KEYSTORE_BASE64" ]; then
          echo "$KEYSTORE_BASE64" | base64 --decode > app/my-release-key.jks
          echo "Keystore Configured."
        else
          echo "No Keystore found. Generating unsigned release."
        fi

    # 5. Build Samsung Store Ready Release APK
    - name: Build Release APK
      run: |
        chmod +x gradlew
        if [ -f "app/my-release-key.jks" ]; then
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=my-release-key.jks \
            -Pandroid.injected.signing.store.password=${{ secrets.SIGNING_STORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.SIGNING_KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.SIGNING_KEY_PASSWORD }}
        else
          ./gradlew assembleRelease
        fi

    # 6. Upload the Final APK Output
    - name: Upload Production APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Vaibhaw-Studio-Release-APK
        path: app/build/outputs/apk/release/*.apk
